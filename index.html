<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1512">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mink</title>

  <!-- Tabler icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

  <!-- App styles -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
</head>
<body>

<div id="app">

  <!-- Content -->
  <main id="app-content" role="main" aria-label="Main content"></main>

  <!-- Floating action button -->
  <button id="fab" aria-label="Add task">
    <i class="ti ti-plus" aria-hidden="true"></i>
  </button>

  <!-- Capture sheet -->
  <div id="capture-overlay" aria-hidden="true"></div>
  <div id="capture-sheet" role="dialog" aria-modal="true" aria-label="Add task"></div>

  <!-- Task detail panel (full-screen slide-in) -->
  <div id="detail-panel" class="hidden" role="dialog" aria-modal="true" aria-label="Task detail"></div>

  <!-- Tab bar -->
  <nav id="tab-bar" aria-label="Main navigation">
    <button class="tab-btn active" data-tab="today" aria-label="Today">
      <i class="ti ti-sun" aria-hidden="true"></i>
      <span>Today</span>
    </button>
    <button class="tab-btn" data-tab="upcoming" aria-label="Upcoming">
      <i class="ti ti-calendar" aria-hidden="true"></i>
      <span>Upcoming</span>
    </button>
    <button class="tab-btn" data-tab="projects" aria-label="Projects">
      <i class="ti ti-folder" aria-hidden="true"></i>
      <span>Projects</span>
    </button>
    <button class="tab-btn" data-tab="stats" aria-label="Stats">
      <i class="ti ti-chart-bar" aria-hidden="true"></i>
      <span>Stats</span>
    </button>
    <button class="tab-btn" data-tab="someday" aria-label="Someday">
      <i class="ti ti-inbox" aria-hidden="true"></i>
      <span>Someday</span>
    </button>
  </nav>

</div>

<!-- Dexie (IndexedDB) -->
<script src="https://cdn.jsdelivr.net/npm/dexie@3/dist/dexie.min.js"></script>

<!-- App scripts — order matters -->
<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script src="js/services.js"></script>
<script src="js/taskrow.js"></script>
<script src="js/capture.js"></script>
<script src="js/views.js"></script>
<script src="js/detail.js"></script>
<script src="js/app.js"></script>

</body>
</html>
